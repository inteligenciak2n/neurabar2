# Docker Compose — Produção
# PostgreSQL: RDS externo (configurado via .env)
# Redis: local (container)
#
# Assets do frontend: buildados localmente e sincronizados via rsync, NÃO mais
# pelo Docker (ver scripts/deploy-assets.sh). O container `app` monta
# public/build/ como bind mount, então basta rodar o script e reiniciar/
# recarregar o container não é nem necessário (Apache lê os arquivos direto).
#
# Build/deploy do backend:
#   docker compose -f compose.prod.yaml up -d --build app

services:
    app:
        build:
            context: '.'
            dockerfile: 'Dockerfile.prod'
        image: 'neurabar/app:latest'
        ports:
            - '127.0.0.1:${APP_PORT:-9090}:80'
        env_file:
            - .env
        volumes:
            - './storage:/var/www/html/storage'
            - './bootstrap/cache:/var/www/html/bootstrap/cache'
            - './public/build:/var/www/html/public/build'
        networks:
            - sail
        depends_on:
            - redis
            - soketi
        restart: unless-stopped

    queue:
        image: 'neurabar/app:latest'
        env_file:
            - .env
        volumes:
            - './storage:/var/www/html/storage'
            - './bootstrap/cache:/var/www/html/bootstrap/cache'
        networks:
            - sail
        depends_on:
            - redis
            - app
        command: ['php', 'artisan', 'queue:work', '--queue=default,broadcasts,payments', '--sleep=3', '--tries=3', '--max-time=3600']
        restart: unless-stopped

    redis:
        image: 'redis:alpine'
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-63790}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
        restart: unless-stopped

    soketi:
        image: 'quay.io/soketi/soketi:latest-16-alpine'
        environment:
            SOKETI_DEBUG: '${SOKETI_DEBUG:-0}'
            SOKETI_METRICS_SERVER_PORT: '9601'
            SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
            SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
            SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
        ports:
            - '127.0.0.1:${PUSHER_PORT:-6001}:6001'
        networks:
            - sail
        restart: unless-stopped

networks:
    sail:
        driver: bridge

volumes:
    sail-redis:
        driver: local
